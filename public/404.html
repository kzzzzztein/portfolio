<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kyle Santos — Web Developer & Digital Solutions Builder</title>
    <!--
      GitHub Pages SPA redirect (encode half).
      GitHub Pages serves this file for any unknown path, e.g. a hard
      refresh on /portfolio/projects/resort-booking-platform. Instead of
      showing a real 404, this script encodes the requested path into a
      query string and redirects to the app's index.html, which decodes it
      back into the real URL (see the inline script in index.html) before
      React Router mounts. Source pattern: https://github.com/rafgraph/spa-github-pages

      pathSegmentsToKeep is 1 because this site is served from a project
      path (/portfolio/) rather than a custom domain at the root. If you
      later move this to a custom domain served from the root, change it
      to 0.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
