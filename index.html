    <!--
      GitHub Pages SPA redirect handling.
      GitHub Pages has no server-side rewrites, so a hard refresh on a route
      like /portfolio/projects/resort-booking-platform normally 404s. The
      matching script in public/404.html encodes the requested path into a
      query string and redirects to this file; this script decodes it and
      restores the real URL via history.replaceState before React Router
      mounts. Source pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>

  </body>
